# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    ignore:
      # `micrometer` in gradle/libs.versions.toml is the oldest Micrometer the library supports, on purpose: take only
      # its patches. Micrometer is compileOnly, so its version never reaches an application
      - dependency-name: "io.micrometer:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # `opentelemetry` and `spring-boot` are the oldest versions we support too, but they go into the POMs of our
      # artifacts. Gradle takes the highest version it sees, so even a patch would raise them in an application on an
      # older one. No updates at all
      - dependency-name: "io.opentelemetry:*"
      - dependency-name: "org.springframework.boot:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: "disabled"
