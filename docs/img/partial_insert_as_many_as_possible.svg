<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
  <title id="t">PartialInsert.INSERT_AS_MANY_AS_POSSIBLE</title>
  <desc id="d">Six messages in three chunks of two. The poison message sits in chunk 2. With INSERT_AS_MANY_AS_POSSIBLE only chunk 2 is skipped: four succeed, two fail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a202c"/>
    </marker>
    <style>
      .msg   { font: 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1a202c; text-anchor: middle; }
      .badge { font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .chunk { font: 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6b7280; text-anchor: end; }
      .note  { font: 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6b7280; }
      .tick  { font: 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6b7280; text-anchor: middle; }
      .big   { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1a202c; text-anchor: middle; }
      .sub   { font: 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <rect x="200" y="26" width="70" height="30" rx="15" fill="#eef7f0" stroke="#3f7d4f" stroke-width="1.3"/>
  <text class="badge" x="235" y="46" fill="#3f7d4f">Ok — 4</text>
  <rect x="284" y="26" width="102" height="30" rx="15" fill="#fdf0ef" stroke="#b04a3f" stroke-width="1.3"/>
  <text class="badge" x="335" y="46" fill="#b04a3f">Failed — 2</text>
  <rect x="200" y="96" width="190" height="44" rx="6" fill="#eef7f0" stroke="#3f7d4f" stroke-width="1.4"/>
  <text class="msg" x="295" y="124">msg #1</text>
  <rect x="200" y="146" width="190" height="44" rx="6" fill="#eef7f0" stroke="#3f7d4f" stroke-width="1.4"/>
  <text class="msg" x="295" y="174">msg #2</text>
  <rect x="200" y="196" width="190" height="44" rx="6" fill="#fdf0ef" stroke="#b04a3f" stroke-width="1.4"/>
  <text class="msg" x="295" y="224">msg #3</text>
  <rect x="200" y="246" width="190" height="44" rx="6" fill="#fdf0ef" stroke="#8f2f24" stroke-width="2.8"/>
  <text class="msg" x="295" y="274">msg #4</text>
  <rect x="200" y="296" width="190" height="44" rx="6" fill="#eef7f0" stroke="#3f7d4f" stroke-width="1.4"/>
  <text class="msg" x="295" y="324">msg #5</text>
  <rect x="200" y="346" width="190" height="44" rx="6" fill="#eef7f0" stroke="#3f7d4f" stroke-width="1.4"/>
  <text class="msg" x="295" y="374">msg #6</text>
  <path d="M 192 96 H 184 V 190 H 192" fill="none" stroke="#6b7280" stroke-width="1.3"/>
  <text class="chunk" x="172" y="147">chunk 1</text>
  <path d="M 192 196 H 184 V 290 H 192" fill="none" stroke="#6b7280" stroke-width="1.3"/>
  <text class="chunk" x="172" y="247">chunk 2</text>
  <path d="M 192 296 H 184 V 390 H 192" fill="none" stroke="#6b7280" stroke-width="1.3"/>
  <text class="chunk" x="172" y="347">chunk 3</text>
  <path d="M 540 268 H 398" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="note" x="550" y="272">poison message</text>
</svg>
