[plugins]

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
nebula-release = { id = "com.netflix.nebula.release", version.ref = "nebula" }

[versions]

# The oldest Java we support: the toolchain of every module. The CI workflows in .github/workflows set up the same JDK,
# change them together
java = "17"
# The Kotlin compiler, for our build only. Applications get the language and the standard library of `kotlin-language` below
kotlin = "2.3.21"
# The oldest Kotlin we support: the language and API version of every module and the standard library in our POMs.
# Keep it the lowest version the compiler accepts without a warning: the lower it is, the more applications can use
# kolbasa. A compiler accepts only a few recent versions, so this one goes up together with `kotlin`
kotlin-language = "2.1"
nebula = "21.2.0"
vanniktech = "0.37.0"

# The oldest Micrometer the library supports: it is built and tested against it
micrometer = "1.13.15"
# The oldest OpenTelemetry the library supports: it is built and tested against it. One version for all the
# OpenTelemetry artifacts, they are released together
opentelemetry = "1.12.0"
hikaricp = "7.1.0"
postgresql = "42.7.14"

clikt = "5.2.1"

# The oldest Spring Boot 4 the starter supports: it is built and tested against it, so it works with any 4.x
spring-boot = "4.0.0"

logback = "1.6.7"
testcontainers = "2.0.5"
junit = "6.1.3"
mockk = "1.14.12"
assertj = "3.27.7"

[libraries]

# Build logic: plugins that our convention plugins apply, see gradle/build-logic
vanniktech-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech" }

# Micrometer
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# OpenTelemetry
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }

# PostgreSQL
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# CLI (butcher only)
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }

# Spring Boot (the starter only)
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-sql = { module = "org.springframework.boot:spring-boot-sql", version.ref = "spring-boot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "spring-boot" }
spring-boot-micrometer-metrics = { module = "org.springframework.boot:spring-boot-micrometer-metrics", version.ref = "spring-boot" }
spring-boot-opentelemetry = { module = "org.springframework.boot:spring-boot-opentelemetry", version.ref = "spring-boot" }

# Logging
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Testing
testcontainers-testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
